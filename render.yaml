# Deploy-ready blueprint. This repo does not deploy it.
# The API ledger lives on the container disk unless you attach a volume.
# Point the dashboard's API_BASE at the API service URL.
services:
  - type: web
    name: llm-watch-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: LLMWATCH_DB
        value: /data/llmwatch.db
      - key: LLMWATCH_SEED
        value: "1"
      - key: LLMWATCH_CORS
        value: "*"
      # Optional document ledger. Leave unset to keep SQLite on LLMWATCH_DB.
      # Do not commit a real URI. This blueprint does not create a cluster.
      # - key: LLMWATCH_MONGODB_URI
      #   sync: false
      # - key: LLMWATCH_MONGODB_DB
      #   value: llmwatch
  - type: web
    name: llm-watch
    runtime: docker
    dockerfilePath: ./dashboard/Dockerfile
    dockerContext: ./dashboard
    envVars:
      - key: API_BASE
        sync: false
