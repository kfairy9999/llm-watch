[project]
name = "llm-watch"
version = "0.1.0"
description = "Log OpenAI-compatible calls, price them, and fail CI when a model swap regresses."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kevin Fairley" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pyyaml>=6",
  "pydantic>=2.9",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "mongomock>=4.3", "pymongo>=4.6"]
mongodb = ["pymongo>=4.6"]

[project.scripts]
llmwatch = "llmwatch.cli:entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmwatch"]

[tool.hatch.build.targets.wheel.force-include]
"llmwatch/prices.default.json" = "llmwatch/prices.default.json"
"llmwatch/suites/customer_support.yaml" = "llmwatch/suites/customer_support.yaml"
"llmwatch/suites/customer_support_outputs.yaml" = "llmwatch/suites/customer_support_outputs.yaml"
"llmwatch/py.typed" = "llmwatch/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
pythonpath = [".", "examples"]
